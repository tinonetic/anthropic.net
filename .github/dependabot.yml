# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/supply-chain-security/configuration-options-for-dependency-updates
#
# Updates are grouped so a handful of PRs (not one per package) are opened. This also keeps the
# open-pull-requests-limit from being exhausted, which silently stops Dependabot from opening new PRs.

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
          - "System.Text.Json"
      test-tools:
        patterns:
          - "xunit*"
          - "Moq"
          - "NSubstitute"
          - "Shouldly"
          - "coverlet.*"
          - "Microsoft.NET.Test.Sdk"
      build-and-analyzers:
        patterns:
          - "StyleCop.*"
          - "Microsoft.VisualStudio.Threading.Analyzers"
          - "MinVer"
          - "Microsoft.SourceLink.*"
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
